<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aDelete // Portfolio</title>
  
  <!-- Подключаем моноширинный шрифт JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- WebGL Canvas для OpenGL/GLSL шейдера фона -->
  <canvas id="bg-canvas"></canvas>

  <!-- Оверлей для VHS сканлайнов и шума -->
  <div class="vhs-overlay"></div>

  <!-- Шапка сайта -->
  <header class="header">
    <div class="logo">[aDELETE_SYS]</div>
    <nav class="nav">
      <a href="#about" class="nav-link">01. ABOUT</a>
      <a href="#projects" class="nav-link">02. PROJECTS</a>
      <a href="#contact" class="nav-link">03. CONTACT</a>
    </nav>
    <div class="status-indicator">
      <span class="dot"></span> SYSTEM: ONLINE
    </div>
  </header>

  <!-- Главная секция (Hero) -->
  <main class="hero">
    <div class="hero-content">
      <div class="terminal-tag">PROT_ID: 0x89A // KYRGYZSTAN</div>
      <!-- На этот заголовок позже повесим Text Scramble -->
      <h1 class="scramble-title" data-value="ADILET SHAMZAEV">ADILET SHAMZAEV</h1>
      <p class="hero-subtitle scramble-sub" data-value="SOFTWARE ENGINEER // BACKEND & GRAPHICS">
        SOFTWARE ENGINEER // BACKEND & GRAPHICS
      </p>

      <div class="hero-actions">
        <a href="#projects" class="btn btn-primary">VIEW_PROJECTS()</a>
        <a href="#contact" class="btn btn-outline">CONTACT_ME()</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
